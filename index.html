<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Edukasi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    h1 {
      color: #ffffff;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.9;
    }

    .video-wrapper {
      width: 100%;
      max-width: 800px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .btn {
      padding: 14px 36px;
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: 0.5px;
    }

    #btnMulai {
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: white;
      box-shadow: 0 6px 20px rgba(46,125,50,0.4);
    }

    #btnMulai:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(46,125,50,0.5);
    }

    #btnFullscreen {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 14px;
      padding: 10px 22px;
    }

    #btnFullscreen:hover {
      background: rgba(255,255,255,0.18);
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h1>📽️ Media Pembelajaran — Teks Puisi</h1>

  <button class="btn" id="btnMulai" onclick="mulai()">▶ Mulai</button>

  <div class="video-wrapper" id="videoBox">
    <video id="vid" controls playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
    <div class="controls">
      <button class="btn" id="btnFullscreen" onclick="fullscreen()">⛶ Layar Penuh</button>
    </div>
  </div>

  <script>
    const vid = document.getElementById('vid');
    const box = document.getElementById('videoBox');
    const btnMulai = document.getElementById('btnMulai');

    function mulai() {
      btnMulai.style.display = 'none';
      box.style.display = 'flex';
      vid.play().catch(() => {});
      vid.scrollIntoView({ behavior: 'smooth', block: 'center' });

      vid.onended = function () {
        window.location.href = 'https://view.genially.com/69d64d4fb0704131c5d9c2a3';
      };
    }

    function fullscreen() {
      if (vid.requestFullscreen) vid.requestFullscreen();
      else if (vid.webkitRequestFullscreen) vid.webkitRequestFullscreen(); // iOS Safari
      else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); // iPhone fallback
    }
  </script>

</body>
</html>
