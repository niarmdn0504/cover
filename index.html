<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Pembelajaran — Teks Puisi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #87ceeb 0%, #b3e5fc 40%, #e1f5fe 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* ── CLOUDS ── */
    .clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.7);
      border-radius: 50px;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }
    @keyframes drift {
      from { transform: translateX(-200px); }
      to   { transform: translateX(110vw); }
    }

    /* ── WRAP ── */
    .wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 720px;
      display: flex; flex-direction: column; align-items: center;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,100,200,0.18);
    }

    /* ── VIDEO ── */
    video {
      width: 100%;
      display: block;
      background: #000;
    }

    /* ── BOTTOM ── */
    .bottom {
      width: 100%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      padding: 22px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #btnMulai {
      padding: 15px 56px;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(46,125,50,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: pulse-green 2s ease-in-out infinite;
    }
    #btnMulai:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(46,125,50,0.6);
      animation: none;
    }
    @keyframes pulse-green {
      0%,100% { box-shadow: 0 6px 24px rgba(46,125,50,0.4); }
      50%      { box-shadow: 0 8px 36px rgba(100,200,100,0.65); }
    }

    #btnLanjut {
      display: none;
      padding: 13px 40px;
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1565c0, #1976d2);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(21,101,192,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #btnLanjut:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(21,101,192,0.6);
    }
  </style>
</head>
<body>

<div class="clouds" id="clouds"></div>

<div class="wrap">
  <video id="vid" autoplay playsinline controls>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="bottom">
    <button id="btnMulai" onclick="keGenially()">▶ Mulai</button>
    <button id="btnLanjut" onclick="keGenially()">🚀 Lanjut ke Materi →</button>
  </div>
</div>

<script>
  // Clouds
  const cloudsEl = document.getElementById('clouds');
  const cloudData = [
    { top: 8,  w: 120, h: 36, dur: 28, delay: 0 },
    { top: 18, w: 80,  h: 24, dur: 22, delay: 5 },
    { top: 5,  w: 160, h: 44, dur: 35, delay: 12 },
    { top: 25, w: 100, h: 30, dur: 26, delay: 8 },
    { top: 12, w: 60,  h: 20, dur: 18, delay: 3 },
  ];
  cloudData.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cloud';
    el.style.cssText = `top:${c.top}%; width:${c.w}px; height:${c.h}px; animation-duration:${c.dur}s; animation-delay:-${c.delay}s;`;
    el.style.setProperty('--tw', c.w + 'px');
    el.before;
    cloudsEl.appendChild(el);
  });

  const vid = document.getElementById('vid');
  const btnMulai = document.getElementById('btnMulai');
  const btnLanjut = document.getElementById('btnLanjut');

  // autoplay fallback
  vid.play().catch(() => {});

  vid.onended = () => {
    btnMulai.style.display = 'none';
    btnLanjut.style.display = 'block';
  };

  function keGenially() {
    window.location.href = 'https://view.genially.com/69d64d4fb0704131c5d9c2a3';
  }
</script>

</body>
</html>
