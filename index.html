<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Pembelajaran — Teks Puisi</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, #4fc3f7 0%, #81d4fa 35%, #b3e5fc 65%, #e1f5fe 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ── SUN ── */
    .sun {
      position: fixed;
      top: 30px; right: 40px;
      width: 80px; height: 80px;
      background: radial-gradient(circle, #fff176 40%, #ffee58 70%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px 20px rgba(255,238,88,0.4);
      animation: sunpulse 4s ease-in-out infinite;
      z-index: 1;
    }
    @keyframes sunpulse {
      0%,100% { box-shadow: 0 0 40px 20px rgba(255,238,88,0.4); }
      50%      { box-shadow: 0 0 60px 30px rgba(255,238,88,0.6); }
    }

    /* ── CLOUDS SVG ── */
    .cloud-wrap {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1; overflow: hidden;
    }
    .cloud-svg { position: absolute; animation: cloudmove linear infinite; }
    @keyframes cloudmove {
      from { transform: translateX(-300px); }
      to   { transform: translateX(110vw); }
    }

    /* ── WRAP ── */
    .wrap {
      position: relative; z-index: 10;
      width: 100%; max-width: 720px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0,100,200,0.2);
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .bottom {
      width: 100%;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(10px);
      padding: 22px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #btnMulai {
      padding: 15px 56px;
      font-size: clamp(17px, 5vw, 22px);
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #2e7d32, #43a047);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(46,125,50,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      animation: pulse-green 2s ease-in-out infinite;
    }
    #btnMulai:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(46,125,50,0.6);
      animation: none;
    }
    @keyframes pulse-green {
      0%,100% { box-shadow: 0 6px 24px rgba(46,125,50,0.4); }
      50%      { box-shadow: 0 8px 36px rgba(100,200,100,0.65); }
    }

    #btnLanjut {
      display: none;
      padding: 13px 40px;
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 900;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #1565c0, #1976d2);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(21,101,192,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #btnLanjut:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(21,101,192,0.6);
    }
  </style>
</head>
<body>

<!-- Sun -->
<div class="sun"></div>

<!-- Clouds SVG -->
<div class="cloud-wrap">
  <svg class="cloud-svg" style="top:5%;animation-duration:30s;animation-delay:0s;" width="220" height="80" viewBox="0 0 220 80">
    <ellipse cx="110" cy="55" rx="100" ry="28" fill="white" opacity="0.9"/>
    <ellipse cx="75"  cy="42" rx="52"  ry="38" fill="white" opacity="0.9"/>
    <ellipse cx="140" cy="40" rx="48"  ry="34" fill="white" opacity="0.9"/>
    <ellipse cx="110" cy="36" rx="38"  ry="30" fill="white" opacity="0.9"/>
  </svg>
  <svg class="cloud-svg" style="top:12%;animation-duration:22s;animation-delay:-8s;" width="160" height="60" viewBox="0 0 160 60">
    <ellipse cx="80"  cy="42" rx="72"  ry="20" fill="white" opacity="0.85"/>
    <ellipse cx="55"  cy="32" rx="38"  ry="28" fill="white" opacity="0.85"/>
    <ellipse cx="105" cy="30" rx="35"  ry="25" fill="white" opacity="0.85"/>
  </svg>
  <svg class="cloud-svg" style="top:20%;animation-duration:38s;animation-delay:-15s;" width="280" height="90" viewBox="0 0 280 90">
    <ellipse cx="140" cy="65" rx="128" ry="28" fill="white" opacity="0.8"/>
    <ellipse cx="90"  cy="50" rx="62"  ry="44" fill="white" opacity="0.8"/>
    <ellipse cx="185" cy="48" rx="58"  ry="40" fill="white" opacity="0.8"/>
    <ellipse cx="140" cy="42" rx="46"  ry="34" fill="white" opacity="0.8"/>
  </svg>
  <svg class="cloud-svg" style="top:2%;animation-duration:26s;animation-delay:-20s;" width="140" height="55" viewBox="0 0 140 55">
    <ellipse cx="70"  cy="38" rx="62"  ry="18" fill="white" opacity="0.75"/>
    <ellipse cx="48"  cy="28" rx="34"  ry="25" fill="white" opacity="0.75"/>
    <ellipse cx="95"  cy="27" rx="30"  ry="22" fill="white" opacity="0.75"/>
  </svg>
</div>

<div class="wrap">
  <video id="vid" autoplay muted playsinline controls>
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="bottom">
    <button id="btnMulai" onclick="keGenially()">▶ Mulai Belajar</button>
    <button id="btnLanjut" onclick="keGenially()">🚀 Lanjut ke Materi →</button>
  </div>
</div>

<script>
  const vid = document.getElementById('vid');
  const btnMulai = document.getElementById('btnMulai');
  const btnLanjut = document.getElementById('btnLanjut');

  vid.play().catch(() => {});

  vid.onended = () => {
    btnMulai.style.display = 'none';
    btnLanjut.style.display = 'block';
  };

  function keGenially() {
    window.location.href = 'https://view.genially.com/69d64d4fb0704131c5d9c2a3';
  }
</script>

</body>
</html>
