<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Video Edukasi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #eef3f8;
      text-align: center;
    }

    .container {
      padding: 40px 20px;
    }

    /* COVER */
    .cover {
      max-width: 700px;
      width: 90%;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* VIDEO */
    video {
      display: none;
      width: 90%;
      max-width: 700px;
      border-radius: 15px;
      margin-top: 20px;
    }

    /* BUTTON */
    button {
      margin-top: 25px;
      padding: 14px 28px;
      font-size: 18px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #1b5e20;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- COVER IMAGE -->
    <img src="cover.jpg" class="cover">

    <!-- VIDEO -->
    <video id="videoPlayer" controls>
      <source src="video.mp4" type="video/mp4">
    </video>

    <!-- BUTTON -->
    <br>
    <button onclick="mulaiVideo()">▶ Mulai</button>

  </div>

  <script>
    const video = document.getElementById("videoPlayer");

    function mulaiVideo() {
      // tampilkan video
      video.style.display = "block";

      // scroll ke video
      video.scrollIntoView({ behavior: "smooth" });

      // play video (dipastikan bisa karena klik user)
      video.play().catch(() => {
        alert("Klik lagi untuk mulai video");
      });

      // redirect setelah selesai
      video.onended = function() {
        window.location.href = "https://view.genially.com/69d64d4fb0704131c5d9c2a3";
      }
    }
  </script>

</body>
</html>
